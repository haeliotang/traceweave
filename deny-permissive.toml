# Restrictive licence policy for the Apache-2.0 components (SDKs, contract
# schemas, conformance probes). These exist so that closed-source products can
# implement the contract, so their dependency closure must stay permissive:
# no GPL, AGPL, LGPL, MPL or other copyleft, and no source-available licences.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9
exceptions = []
