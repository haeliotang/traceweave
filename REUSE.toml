precedence = "closest"
SPDX-FileCopyrightText = "2023-2026 The ggml authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "agent_os/android/AndroidManifest.xml", "android/AndroidManifest.xml",
    "android/lifecycle_probe/AndroidManifest.xml", "android/security_probe/AndroidManifest.xml",
    "agent_os/tests/android/*.xml", "agent_os/tests/automerge/AndroidManifest.xml",
    "agent_os/tests/android/*.patch", "agent_os/tests/data/**",
