# REUSE annotations for files that cannot carry SPDX headers (generated,
# binary, JSON/XML, frozen evidence) or where a bulk declaration is clearer.
# Header information in individual files always takes precedence.
version = 1

[[annotations]]
path = ["artifacts/**", "field_telemetry/**", "pixel_physical/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["data/**/*.txt", "data/**/SHA256SUMS"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["data/**/*.py"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["docs/protocol/agent-manifest.schema.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "README.md", "README.zh-CN.md", "CHANGELOG.md", "CONTRIBUTING.md",
    "GOVERNANCE.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "CITATION.cff",
    "LICENSING.md", "CLA.md", "agent_os/README.md", "agent_os/sdk_android/README.md",
    "agent_os/sdk_python/README.md", "agent_os/branding/README.md",
    "native/private_alignment_probe/README.md", "native/zk_alignment/README.md",
    "research/README.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["agent_os/branding/**", "agent_os/android/res/mipmap*/**", "agent_os/android/res/drawable*/**"]
