precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["agent_os/android/res/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
