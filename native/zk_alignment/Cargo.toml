[package]
name = "traceform-zk-alignment"
version = "0.1.0"
edition = "2021"
authors = ["Inceptless <support@inceptless.com>"]
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
ark-bls12-381 = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["crh", "r1cs"] }
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-r1cs-std = "=0.5.0"
ark-serialize = "=0.5.0"
ark-std = "=0.5.0"
rand = { version = "=0.8.8", features = ["getrandom"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "=0.2.189"

[profile.test]
opt-level = 2
