name: Agent OS Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent_os/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Test core and persistence policy
        run: |
          rustup run 1.94.0 cargo test --locked --lib
          rustup run 1.94.0 cargo test --locked --test causal_memory_merge --test persistent_store_policy

  sync-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent_os/sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Test sync transport limits and binding
        run: rustup run 1.94.0 cargo test --locked --lib

  android-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild pinned on-device model runtime
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama-source"
          git -C "$RUNNER_TEMP/llama-source" fetch --depth=1 https://github.com/ggml-org/llama.cpp.git d78f40d9d34d7a72ecdcd2e854f75ff86afc8ca3
          git -C "$RUNNER_TEMP/llama-source" checkout --detach FETCH_HEAD
          python3 agent_os/scripts/build_experimental_model_runtime.py \
            --llama-source "$RUNNER_TEMP/llama-source" \
            --ndk "$ANDROID_NDK_HOME" \
            --output-dir agent_os/build/model-runtime-ci
      - name: Build and verify with disposable signing identity
        shell: bash
        run: |
          set -euo pipefail
          python3 agent_os/scripts/ci_android.py \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --model-runtime agent_os/build/model-runtime-ci/libtraceform_local_model.so
