[package]
name = "agent-os-core"
version = "0.1.0"
edition = "2021"
authors = ["Agent OS Authors"]
description = "Native high-performance core engine for Agent OS: SLM inference, context redaction, and memory consolidation"

[lib]
name = "agent_os_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["jsvalue-enum"] }
jni = { version = "0.21", default-features = false }
regex = "1.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 2
