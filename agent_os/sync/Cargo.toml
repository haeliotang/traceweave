[package]
name = "traceweave-sync"
version = "0.1.0"
edition = "2021"
authors = ["Inceptless <support@inceptless.com>"]
license = "AGPL-3.0-or-later"
description = "Traceweave cross-device sync transport (default off, synthetic tests only)"

[lib]
name = "traceweave_sync"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "sync-probe"
path = "src/bin/sync_probe.rs"

[dependencies]
futures = "0.3"
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "ed25519", "request-response", "cbor", "mdns"] }
sha2 = "0.10"
jni = "0.21"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-std"] }
